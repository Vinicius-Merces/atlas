name: P5 RelayOps Calibration

on:
  push:
    branches:
      - bench/p5-relayops-calibration-gpt-5-6-sol

permissions:
  contents: write

jobs:
  calibrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APP_DIR: benchmarks/reference-builds/campaigns/p5/runs/calibration-gpt-5-6-sol/site
      RUN_DIR: benchmarks/reference-builds/campaigns/p5/runs/calibration-gpt-5-6-sol/run
      CLOUDFLARED_VERSION: "2026.5.2"
      CLOUDFLARED_LINUX_AMD64_SHA256: "5286698547f03df745adb2355f04c12dde52ef425491e81f433642d695521886"

    steps:
      - name: Check out calibration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install jsonschema==4.25.1 PyYAML==6.0.2

      - name: Verify frozen manifest, exact hashes and schemas
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          root = Path('.')
          run_dir = root / 'benchmarks/reference-builds/campaigns/p5/runs/calibration-gpt-5-6-sol/run'
          manifest = json.loads((run_dir / 'manifest.json').read_text())
          schema = json.loads((root / 'benchmarks/reference-builds/campaigns/p5/run-manifest.schema.json').read_text())
          Draft202012Validator(schema).validate(manifest)
          fixture = root / 'benchmarks/reference-builds/specs/multitenant-subscription-saas.yaml'
          rubric = root / 'benchmarks/reference-builds/scoring-rubric.yaml'
          assert hashlib.sha256(fixture.read_bytes()).hexdigest() == manifest['fixture_sha256']
          assert hashlib.sha256(rubric.read_bytes()).hexdigest() == manifest['rubric_sha256']
          env = json.loads((run_dir / 'environment-capability.json').read_text())
          env_schema = json.loads((root / 'benchmarks/reference-builds/campaigns/p4/assurance/environment-capability.schema.json').read_text())
          Draft202012Validator(env_schema).validate(env)
          assert manifest['campaign_base_commit'] == '99cdbdbf40ca2709bb4e0d99b7d3320d9f89610b'
          assert manifest['runtime'] == 'chatgpt' and manifest['model'] == 'GPT-5.6 Sol'
          print('P5 calibration manifest and exact hashes verified.')
          PY
          python scripts/validate_benchmark_runner_contract.py \
            --manifest "$RUN_DIR/runner-contract.json" \
            --target-root .

      - name: Build and execute adversarial SaaS tests
        run: |
          cd "$APP_DIR"
          npm install --ignore-scripts
          npm run build
          RELAYOPS_EVIDENCE_DIR="../run/evidence" npm test

      - name: Install authenticated Chromium runner
        run: |
          mkdir -p .atlas-p5-browser
          printf '%s\n' '{"name":"relayops-calibration-browser","version":"1.0.0","private":true}' > .atlas-p5-browser/package.json
          npm install --prefix .atlas-p5-browser --ignore-scripts playwright@1.55.0
          npx --prefix .atlas-p5-browser playwright install --with-deps chromium

      - name: Start local production server
        run: |
          cd "$APP_DIR"
          nohup setsid env PORT=4173 npm start > /tmp/relayops-p5.log 2>&1 &
          echo $! > /tmp/relayops-p5.pid
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/relayops-p5.log
          exit 1

      - name: Execute authenticated Chromium workflow
        env:
          NODE_PATH: ${{ github.workspace }}/.atlas-p5-browser/node_modules
          RELAYOPS_BROWSER_BASE_URL: http://127.0.0.1:4173
          RELAYOPS_BROWSER_EVIDENCE_DIR: ${{ github.workspace }}/benchmarks/reference-builds/campaigns/p5/runs/calibration-gpt-5-6-sol/run/evidence/browser
        run: node "$APP_DIR/tests/browser-flow.cjs"

      - name: Install pinned cloudflared
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64" \
            --output /tmp/cloudflared
          echo "${CLOUDFLARED_LINUX_AMD64_SHA256}  /tmp/cloudflared" | sha256sum --check --strict
          chmod +x /tmp/cloudflared

      - name: Open controlled public HTTPS
        id: ingress
        run: |
          STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          nohup /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:4173 > /tmp/relayops-p5-cloudflared.log 2>&1 &
          echo $! > /tmp/relayops-p5-cloudflared.pid
          URL=""
          for i in $(seq 1 60); do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/relayops-p5-cloudflared.log | head -n 1 || true)
            if [ -n "$URL" ]; then break; fi
            sleep 1
          done
          test -n "$URL" || { cat /tmp/relayops-p5-cloudflared.log; exit 1; }
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "started_at=$STARTED_AT" >> "$GITHUB_OUTPUT"
          echo "Controlled preview: $URL"

      - name: Restart app with assigned public origin
        env:
          PUBLIC_URL: ${{ steps.ingress.outputs.url }}
        run: |
          kill -- -"$(cat /tmp/relayops-p5.pid)" || true
          cd "$APP_DIR"
          nohup setsid env PORT=4173 RELAYOPS_ORIGIN="$PUBLIC_URL" npm start > /tmp/relayops-p5.log 2>&1 &
          echo $! > /tmp/relayops-p5.pid
          for i in $(seq 1 60); do
            if curl --fail --silent "$PUBLIC_URL/api/health" >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/relayops-p5.log || true
          cat /tmp/relayops-p5-cloudflared.log || true
          exit 1

      - name: Collect controlled deployment and portable browser evidence
        env:
          PUBLIC_URL: ${{ steps.ingress.outputs.url }}
          STARTED_AT: ${{ steps.ingress.outputs.started_at }}
          NODE_PATH: ${{ github.workspace }}/.atlas-p5-browser/node_modules
        run: |
          python scripts/probe_controlled_deployment.py \
            --url "$PUBLIC_URL" \
            --source-ref "bench/p5-relayops-calibration-gpt-5-6-sol" \
            --source-commit "$(git rev-parse HEAD)" \
            --provider cloudflare-quick-tunnel \
            --deployment-class controlled-preview \
            --health-path /api/health \
            --started-at "$STARTED_AT" \
            --output "$RUN_DIR/deployment.json"
          python scripts/validate_controlled_deployment_evidence.py --manifest "$RUN_DIR/deployment.json"
          node scripts/collect_portable_browser_evidence.cjs \
            --base-url "$PUBLIC_URL" \
            --routes '/login,/dashboard,/customers,/work-orders,/billing,/import-export,/admin' \
            --output-dir "$RUN_DIR/evidence/public-browser"

      - name: Generate and validate assurance sidecars
        run: |
          node "$APP_DIR/scripts/build-assurance.js"
          node "$APP_DIR/scripts/build-evidence-assurance.js"
          python scripts/validate_relayops_assurance.py --manifest "$RUN_DIR/saas-assurance.json"
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          root = Path('.')
          run_dir = root / 'benchmarks/reference-builds/campaigns/p5/runs/calibration-gpt-5-6-sol/run'
          evidence = json.loads((run_dir / 'evidence-assurance.json').read_text())
          schema = json.loads((root / 'benchmarks/reference-builds/campaigns/p4/assurance/evidence-assurance.schema.json').read_text())
          Draft202012Validator(schema).validate(evidence)
          browser = json.loads((run_dir / 'evidence/browser/browser-auth-flow.json').read_text())
          assert browser['passed'] is True
          assert evidence['deployment']['deployment_class'] == 'controlled-preview'
          assert evidence['deployment']['claimable_production'] is False
          print('Shared evidence assurance and authenticated browser evidence verified.')
          PY

      - name: Freeze implementation and generated evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$APP_DIR" "$RUN_DIR"
          git commit -m "bench(p5): freeze RelayOps calibration implementation and evidence" || exit 0
          git push origin HEAD:bench/p5-relayops-calibration-gpt-5-6-sol
