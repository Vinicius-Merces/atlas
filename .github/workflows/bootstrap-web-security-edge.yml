name: Bootstrap web security edge artifacts

on:
  push:
    branches:
      - feat/web-security-edge-assurance

permissions:
  contents: write

concurrency:
  group: bootstrap-web-security-edge
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/web-security-edge-assurance
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --requirement requirements-test.txt

      - name: Register capability surfaces
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('.claude/registry.json')
          data = json.loads(path.read_text(encoding='utf-8'))

          additions = {
              'workflows': ['web-security-edge-assurance'],
              'skills': ['crawler-edge-access-audit', 'web-security-header-audit'],
              'reviews': ['web-security-edge-assurance-review'],
          }
          for key, values in additions.items():
              current = set(data.get(key, []))
              current.update(values)
              data[key] = sorted(current)

          assurance = data.setdefault('assurance', {})
          assurance['web_security_edge_assurance_model'] = 'framework/web-security-edge-assurance-model.md'

          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Regenerate canonical and runtime artifacts
        run: |
          python scripts/generate_capability_catalogs.py
          python scripts/sync_codex_adapter.py
          python scripts/sync_native_skills.py

      - name: Commit generated artifacts when needed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude/registry.json docs/agent-catalog.md docs/skill-catalog.md adapters/codex .agents/skills
          if git diff --cached --quiet; then
            echo "Generated artifacts already current."
            exit 0
          fi
          git commit -m "chore: register web security edge capability artifacts"
          git push origin HEAD:feat/web-security-edge-assurance
