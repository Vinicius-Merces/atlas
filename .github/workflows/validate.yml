name: Validate ATLAS

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-test.txt

      - name: Validate capability taxonomy
        shell: bash
        run: |
          set +e
          output="$(python scripts/validate_capability_taxonomy.py 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              [ -n "$line" ] && printf '::error title=Capability taxonomy::%s\n' "$line"
            done <<< "$output"
          fi
          exit "$status"

      - name: Run portable release validation profile
        run: python scripts/validate_all.py --profile release
