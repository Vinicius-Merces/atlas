name: Validate ATLAS

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-test.txt

      - name: Validate capability taxonomy
        shell: bash
        run: |
          set +e
          output="$(python scripts/validate_capability_taxonomy.py 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              [ -n "$line" ] && printf '::error title=Capability taxonomy::%s\n' "$line"
            done <<< "$output"
          fi
          exit "$status"

      - name: Validate discovery descriptions
        shell: bash
        run: |
          set +e
          output="$(python scripts/validate_discovery_metadata.py 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              [ -n "$line" ] && printf '::error title=Discovery metadata::%s\n' "$line"
            done <<< "$output"
          fi
          exit "$status"

      - name: Measure capability quality
        shell: bash
        run: |
          python scripts/evaluate_skill_quality.py
          python scripts/evaluate_skill_routing.py
          python scripts/analyze_agent_overlap.py
          python scripts/validate_capability_evaluation_pack.py

      - name: Run contract tests
        shell: bash
        run: |
          set +e
          output="$(python -m pytest tests/contract -q 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            diagnostics="$(printf '%s\n' "$output" | tail -n 25)"
            diagnostics="${diagnostics//'%'/'%25'}"
            diagnostics="${diagnostics//$'\r'/'%0D'}"
            diagnostics="${diagnostics//$'\n'/'%0A'}"
            printf '::error title=ATLAS contract tests::%s\n' "$diagnostics"
          fi
          exit "$status"

      - name: Run portable release validation profile
        shell: bash
        run: |
          set +e
          output="$(python scripts/validate_all.py --profile release 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            diagnostics="$(printf '%s\n' "$output" | tail -n 30)"
            diagnostics="${diagnostics//'%'/'%25'}"
            diagnostics="${diagnostics//$'\r'/'%0D'}"
            diagnostics="${diagnostics//$'\n'/'%0A'}"
            printf '::error title=ATLAS release validation::%s\n' "$diagnostics"
          fi
          exit "$status"
