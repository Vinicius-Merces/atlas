name: P2 Integration

on:
  push:
    branches:
      - feat/atlas-p2-full-stack-delivery-pack

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --requirement requirements-test.txt
      - name: Integrate P2 canonical registry and routes
        run: python scripts/integrate_p2_full_stack_delivery.py
      - name: Regenerate capability catalogs
        run: python scripts/generate_capability_catalogs.py
      - name: Synchronize native Codex skill wrappers
        run: python scripts/sync_native_skills.py
      - name: Synchronize Codex adapter
        run: python scripts/sync_codex_adapter.py
      - name: Commit synchronized P2 surfaces
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No synchronization changes"
          else
            git commit -m "chore: synchronize P2 full-stack delivery surfaces"
            git push
          fi
