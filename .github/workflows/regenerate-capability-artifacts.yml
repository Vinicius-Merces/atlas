name: Regenerate capability artifacts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --requirement requirements-test.txt

      - name: Regenerate canonical and Codex catalogs
        run: |
          python scripts/generate_capability_catalogs.py
          python scripts/sync_codex_adapter.py
          python scripts/sync_native_skills.py

      - name: Commit generated artifacts
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Generated artifacts already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/agent-catalog.md docs/skill-catalog.md adapters/codex .agents/skills
          git commit -m "chore: regenerate capability artifacts"
          git push origin HEAD:${GITHUB_REF_NAME}
