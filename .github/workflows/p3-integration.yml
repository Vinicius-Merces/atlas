name: P3 Integration

on:
  push:
    branches:
      - feat/atlas-p3-reference-build-benchmark

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --requirement requirements-test.txt
      - name: Integrate P3 registry and routing
        run: python scripts/integrate_p3_reference_build_benchmark.py
      - name: Synchronize Codex adapter
        run: python scripts/sync_codex_adapter.py
      - name: Validate P3 harness
        run: |
          python scripts/validate_reference_build_benchmark_pack.py
          python scripts/run_reference_build_benchmark.py --suite-smoke
          python -m pytest tests/contract/test_reference_build_benchmark_pack.py -q
      - name: Validate complete ATLAS release profile
        run: python scripts/validate_all.py --profile release --skip-incremental
      - name: Commit synchronized P3 surfaces
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No synchronization changes"
          else
            git commit -m "chore: integrate P3 reference build benchmark"
            git push
          fi
