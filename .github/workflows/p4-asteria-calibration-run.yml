name: P4 Asteria Calibration Run
on:
  push:
    branches: [bench/p4-asteria-calibration-gpt-5-6-sol]
permissions:
  contents: write
jobs:
  calibrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash reference-builds/asteria-residences/tests/run_calibration.sh
