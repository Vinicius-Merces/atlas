version: 1
mode: free_pool
default_profile: demo-chat
max_attempts: 3
total_timeout_ms: 20000
allow_paid_fallback: false

profiles:
  demo-chat:
    requires: [chat]
    data_class: public
    latency_ms: 12000
    replay_safe: true
    paid_fallback: false

  classification-low-cost:
    requires: [chat, structured-output]
    data_class: internal
    latency_ms: 6000
    replay_safe: true
    paid_fallback: false

  support-summary:
    requires: [chat]
    data_class: internal
    latency_ms: 8000
    replay_safe: true
    paid_fallback: false

  high-reasoning:
    requires: [chat, reasoning]
    data_class: internal
    latency_ms: 20000
    replay_safe: true
    paid_fallback: false

providers:
  groq-demo:
    adapter: openai-compatible
    class: hosted
    financial_class: free-tier
    priority: 10
    enabled_env: GROQ_ENABLED
    base_url_env: GROQ_BASE_URL
    api_key_env: GROQ_API_KEY
    model_env: GROQ_MODEL
    capabilities: [chat]
    privacy:
      max_data_class: public
    fallback:
      eligible: true
    health:
      cooldown_seconds: 30

  ollama-cloud:
    adapter: ollama-native
    class: hosted
    financial_class: free-tier
    priority: 20
    enabled_env: OLLAMA_CLOUD_ENABLED
    base_url_env: OLLAMA_CLOUD_BASE_URL
    api_key_env: OLLAMA_API_KEY
    model_env: OLLAMA_CLOUD_MODEL
    capabilities: [chat]
    privacy:
      max_data_class: public
    fallback:
      eligible: true
    health:
      cooldown_seconds: 30

  cloudflare-workers-ai:
    adapter: openai-compatible
    class: hosted
    financial_class: free-tier
    priority: 30
    enabled_env: CLOUDFLARE_AI_ENABLED
    base_url_env: CLOUDFLARE_AI_BASE_URL
    api_key_env: CLOUDFLARE_API_KEY
    model_env: CLOUDFLARE_AI_MODEL
    capabilities: [chat]
    privacy:
      max_data_class: public
    fallback:
      eligible: true
    health:
      cooldown_seconds: 30

  openrouter-free:
    adapter: openai-compatible
    class: hosted
    financial_class: free-tier
    priority: 40
    enabled_env: OPENROUTER_ENABLED
    base_url_env: OPENROUTER_BASE_URL
    api_key_env: OPENROUTER_API_KEY
    model_env: OPENROUTER_MODEL
    capabilities: [chat]
    privacy:
      max_data_class: public
    fallback:
      eligible: true
    health:
      cooldown_seconds: 60

  github-models:
    adapter: openai-compatible
    class: hosted
    financial_class: free-tier
    priority: 45
    enabled_env: GITHUB_MODELS_ENABLED
    base_url_env: GITHUB_MODELS_BASE_URL
    api_key_env: GITHUB_MODELS_TOKEN
    model_env: GITHUB_MODELS_MODEL
    capabilities: [chat]
    privacy:
      max_data_class: public
    fallback:
      eligible: true
    health:
      cooldown_seconds: 60

  gemini-free:
    adapter: openai-compatible
    class: hosted
    financial_class: free-tier
    priority: 47
    enabled_env: GEMINI_ENABLED
    base_url_env: GEMINI_BASE_URL
    api_key_env: GEMINI_API_KEY
    model_env: GEMINI_MODEL
    capabilities: [chat]
    privacy:
      max_data_class: public
    fallback:
      eligible: true
    health:
      cooldown_seconds: 60

  ollama-remote:
    adapter: ollama-native
    class: self-hosted
    financial_class: owned-compute
    priority: 50
    enabled_env: OLLAMA_REMOTE_ENABLED
    base_url_env: OLLAMA_REMOTE_BASE_URL
    api_key_env: OLLAMA_REMOTE_GATEWAY_KEY
    model_env: OLLAMA_REMOTE_MODEL
    capabilities: [chat]
    privacy:
      max_data_class: confidential
    fallback:
      eligible: true
    health:
      cooldown_seconds: 20

  ollama-local:
    adapter: ollama-native
    class: local
    financial_class: owned-compute
    priority: 60
    enabled_env: OLLAMA_LOCAL_ENABLED
    base_url_env: OLLAMA_LOCAL_BASE_URL
    api_key_env: OLLAMA_LOCAL_GATEWAY_KEY
    model_env: OLLAMA_LOCAL_MODEL
    capabilities: [chat]
    privacy:
      max_data_class: confidential
    fallback:
      eligible: true
    health:
      cooldown_seconds: 10

# Add structured-output, tools, reasoning, vision, embeddings, or other
# capabilities only after the exact configured model has been verified for them.
# Free-tier status, data-use terms, API limits and model identifiers are external
# state. Revalidate them before every public/client deployment. Never commit real credentials.
